name: partner-expense-control-erp

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pec_erp
      POSTGRES_USER: pec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pec_local_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pec -d pec_erp"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      ENVIRONMENT: docker
      DATABASE_URL: postgresql+psycopg://pec:${POSTGRES_PASSWORD:-pec_local_password}@db:5432/pec_erp
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-only-change-me-0123456789abcdef}
      CORS_ORIGINS: http://localhost:3000
      STORAGE_LOCAL_PATH: /app/storage
    volumes:
      - attachments:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  attachments:
