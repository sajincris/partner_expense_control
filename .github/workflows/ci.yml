name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests alembic
      - name: Tests (unit + API integration)
        run: pytest -q --cov=app --cov-report=term-missing

  migrations:
    name: Backend — PostgreSQL migration & seed smoke test
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pec_erp
          POSTGRES_USER: pec
          POSTGRES_PASSWORD: pec_ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pec -d pec_erp" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://pec:pec_ci_password@localhost:5432/pec_erp
      JWT_SECRET_KEY: ci-only-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Upgrade to head
        run: alembic upgrade head
      - name: Seed demo data through the real workflow
        run: python -m app.seed
      - name: Database controls hold (append-only audit, locked lines)
        run: |
          python - <<'PY'
          from sqlalchemy import text
          from app.core.database import engine
          with engine.connect() as c:
              for sql in ("UPDATE audit_logs SET action='X'",
                          "UPDATE expense_lines SET amount = amount + 1 WHERE report_id IN (SELECT id FROM expense_reports WHERE status='APPROVED')"):
                  try:
                      c.execute(text(sql)); raise SystemExit(f"control failed: {sql}")
                  except Exception as e:
                      if isinstance(e, SystemExit): raise
                      print("blocked as expected:", str(e).splitlines()[0]); c.rollback()
          PY
      - name: Downgrade to base
        run: alembic downgrade base

  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
